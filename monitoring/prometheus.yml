# "app" is the app machine. docker-compose.yml points it at APP_HOST
# (default: this machine).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: node            # whole-machine CPU / memory
    static_configs: [{ targets: ['app:9100'] }]

  - job_name: process         # CPU / memory per process (pm2 daemon vs workers)
    static_configs: [{ targets: ['app:9256'] }]

  - job_name: watt            # Watt's own metrics (only up while Watt runs)
    static_configs: [{ targets: ['app:9091'] }]
