# Run on the MONITORING instance (a small t3.small is fine: it is mostly idle).
#   APP_HOST=10.0.2.10 docker compose up -d
# Grafana: http://<monitoring-ip>:3001  (admin / admin)
# The "pm2 vs Watt" dashboard is loaded automatically (Dashboards > Benchmarks).
services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver   # lets k6 push its metrics here
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    restart: unless-stopped
